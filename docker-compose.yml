services:
  spark-master:
    image: bitnami/spark:latest
    container_name: spark-master
    environment:
      - "8080:8080"
      - "7077:7077"
    networks:
      - spark-network
    volumes:
      - /home/shtlp_0147/Training/Spark-cluster/data:/data:ro

  spark-worker-1:
    image: bitnami/spark:latest
    container_name: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    ports:
      - "8081:8081"
    depends_on:
      - spark-master
    networks:
      - spark-network
    volumes:
      - /home/shtlp_0147/Training/Spark-cluster/data:/data:ro

  spark-worker-2:
    image: bitnami/spark:latest
    container_name: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    ports:
      - "8082:8081"
    depends_on:
      - spark-master
    networks:
      - spark-network
    volumes:
      - /home/shtlp_0147/Training/Spark-cluster/data:/data:ro

  spark-submit:
    image: bitnami/spark:latest
    container_name: spark-submit
    depends_on:
      - spark-master
    volumes:
      - /home/shtlp_0147/Training/Spark-cluster/spark/app:/app
      - /home/shtlp_0147/Training/Spark-cluster/data:/data:ro
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
    ports:
      - "8083:8081"
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge